# DiagnoConnect - Docker Compose
# Complete production-ready healthcare platform

version: '3.8'

services:
  # ============================================================
  # Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: dc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagnosconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diagnosconnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dc-network

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: dc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dc-network

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: dc-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/diagnosconnect
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-production-jwt-secret-change-this}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-production-refresh-secret-change-this}
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:8080
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: noreply@diagnosconnect.com
      ARIFPAY_API_KEY: ${ARIFPAY_API_KEY:-}
      ARIFPAY_MERCHANT_ID: ${ARIFPAY_MERCHANT_ID:-}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dc-network

  # ============================================================
  # Patient Portal (Nginx)
  # ============================================================
  patient-portal:
    build:
      context: .
      dockerfile: apps/patient-portal/Dockerfile
    container_name: dc-patient-portal
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dc-network

  # ============================================================
  # Admin Dashboard (Nginx)
  # ============================================================
  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    container_name: dc-admin-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dc-network

  # ============================================================
  # Nginx Reverse Proxy (Production)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: dc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/hosts:/etc/nginx/hosts
    depends_on:
      - backend
      - patient-portal
      - admin-dashboard
    networks:
      - dc-network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  dc-network:
    driver: bridge
